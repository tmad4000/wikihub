<section id="page-comments" aria-labelledby="comments-heading"
  data-url="/@{{ owner.username|urlencode }}/{{ wiki.slug|urlencode }}/-/pages/{{ page.id }}/annotations"
  data-target="@{{ owner.username }}/{{ wiki.slug }}/{{ page.path }}"
  data-revision="{{ page.content_hash or '' }}"
  data-viewer="{{ current_user.id if current_user.is_authenticated else '' }}">
  <h2 id="comments-heading">Comments</h2>
  {% if current_user.is_authenticated %}
  <button class="action-btn" type="button" data-compose>Comment on page</button>
  <button class="action-btn" type="button" data-selection hidden>Comment on selection</button>
  {% endif %}
  <p data-status role="status"></p><ol data-comments></ol>
  {% if current_user.is_authenticated %}
  <form data-comment-form hidden>
    <strong data-heading></strong><p data-destination></p><blockquote data-quote hidden></blockquote>
    <label>Comment<textarea data-body required maxlength="2000" rows="4"></textarea></label>
    <button class="action-btn" type="submit">Approve and post comment</button>
    <button class="action-btn" type="button" data-cancel>Cancel</button>
  </form>
  {% if current_user.id == wiki.owner_id %}
  <form data-page-form hidden method="post" action="{{ url_for('wiki.new_page',username=owner.username,slug=wiki.slug) }}">
    <strong>Review new page</strong><p>In @{{ owner.username }}/{{ wiki.slug }} · Private</p>
    <label>New page filename<input name="path" required maxlength="100" pattern="[A-Za-z0-9][A-Za-z0-9 _-]*\.md" placeholder="Reading notes.md"></label>
    <label>Page Markdown<textarea name="content" required rows="8"></textarea></label>
    <input type="hidden" name="visibility" value="private"><input type="hidden" name="assistant_draft" value="1">
    <input type="hidden" name="viewer_id" value="{{ current_user.id }}"><input type="hidden" name="approved" value="1">
    <input type="hidden" name="request_id"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button class="action-btn" type="submit">Approve and create private page</button>
    <button class="action-btn" type="button" data-cancel>Cancel</button>
  </form>
  {% endif %}
  {% endif %}
  <input type="hidden" data-token value="{{ csrf_token() }}">
</section>
<link rel="stylesheet" href="{{ url_for('static',filename='annotations.css') }}">
<script defer src="{{ url_for('static',filename='js/annotations.js') }}"></script>
