name: Production worker runtime
on: [push, pull_request]
permissions:
  contents: read
jobs:
  worker-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: runtime_test
          POSTGRES_PASSWORD: runtime_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runtime_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WORKER_TEST_DATABASE_URL: postgresql://runtime_test:runtime_test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tests/test_gunicorn_runtime.py
      - run: python tests/test_directory_scaling.py
      - run: python tests/test_reader_scaling.py
      - run: python tests/test_reader_acl_privacy.py
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wikihub
          POSTGRES_PASSWORD: wikihub
          POSTGRES_DB: wikihub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wikihub -d wikihub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://wikihub:wikihub@127.0.0.1:5432/wikihub_test
      REPOS_DIR: /tmp/wikihub-test-repos
      SECRET_KEY: ci-test-secret
      ADMIN_TOKEN: ci-test-admin-token
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: git config --global user.email ci@wikihub.md && git config --global user.name "wikihub ci"
      - run: python tests/test_e2e.py
      - name: Delegated connector identity, ACL and replay regression
        run: |
          PGPASSWORD=wikihub createdb -h 127.0.0.1 -U wikihub wikihub_ecosystem_adapter_test
          DATABASE_URL=postgresql://wikihub:wikihub@127.0.0.1:5432/wikihub_ecosystem_adapter_test REPOS_DIR=/tmp/wikihub-ecosystem-connector-test-repos python tests/test_connector.py
