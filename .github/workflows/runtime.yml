name: Production worker runtime
on: [push, pull_request]
permissions:
  contents: read
jobs:
  worker-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: runtime_test
          POSTGRES_PASSWORD: runtime_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runtime_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WORKER_TEST_DATABASE_URL: postgresql://runtime_test:runtime_test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tests/test_gunicorn_runtime.py
      - run: python tests/test_directory_scaling.py
      - run: python tests/test_reader_scaling.py
