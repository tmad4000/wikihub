# AI / SEO bot throttling for wikihub. Two layers:
#   1. is_ai_bot → used in /etc/nginx/sites-enabled/wikihub to 429 expensive
#      /history and /commit/<sha> endpoints entirely.
#   2. global bot rate limit (60r/m per UA) — keeps overall bot load polite
#      so they cannot saturate the 1-vCPU box even on cheap routes.
# Bots can still index regular page reads, just at a sustainable rate.

map $http_user_agent $is_ai_bot {
    default              "";
    "~*GPTBot"           "1";
    "~*ClaudeBot"        "1";
    "~*PerplexityBot"    "1";
    "~*Applebot"         "1";
    "~*Bytespider"       "1";
    "~*GoogleOther"      "1";
    "~*MJ12bot"          "1";
    "~*SemrushBot"       "1";
    "~*AhrefsBot"        "1";
    "~*DotBot"           "1";
    "~*facebookexternalhit" "1";
    # ops-defense 2026-11-14: heavy crawlers seen in Cloudflare analytics Nov 7-14
    "~*Reflectionbot" "1";
    "~*ShapBot" "1";
    "~*meta-externalagent" "1";
    "~*meta-webindexer" "1";
    "~*OAI-SearchBot" "1";
    "~*Amazonbot" "1";
    "~*ExaSearchBot" "1";
    "~*SERankingBacklinksBot" "1";
    "~*CCBot" "1";
    "~*PetalBot" "1";
    "~*DataForSeoBot" "1";
    "~*ImagesiftBot" "1";
}

# Map bot UA to a stable key for limit_req. Non-bots get empty string,
# which means limit_req will not throttle them.
map $http_user_agent $bot_key {
    default              "";
    "~*GPTBot"           "gptbot";
    "~*ClaudeBot"        "claudebot";
    "~*PerplexityBot"    "perplexity";
    "~*Applebot"         "applebot";
    "~*Bytespider"       "bytespider";
    "~*GoogleOther"      "googleother";
    "~*MJ12bot"          "mj12bot";
    "~*SemrushBot"       "semrushbot";
    "~*AhrefsBot"        "ahrefsbot";
    "~*DotBot"           "dotbot";
    "~*facebookexternalhit" "fbexternal";
    # ops-defense 2026-11-14: heavy crawlers seen in Cloudflare analytics Nov 7-14
    "~*Reflectionbot" "reflectionbot";
    "~*ShapBot" "shapbot";
    "~*meta-externalagent" "metaexternal";
    "~*meta-webindexer" "metawebindexer";
    "~*OAI-SearchBot" "oaisearch";
    "~*Amazonbot" "amazonbot";
    "~*ExaSearchBot" "exa";
    "~*SERankingBacklinksBot" "seranking";
    "~*CCBot" "ccbot";
    "~*PetalBot" "petalbot";
    "~*DataForSeoBot" "dataforseo";
    "~*ImagesiftBot" "imagesift";
}

# 60 requests per minute per bot identity, allow burst of 20.
# Empty key (humans) is not throttled.
limit_req_zone $bot_key zone=botsglobal:10m rate=60r/m;
limit_req_status 429;
